<div class="mb-3{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check">{{ field }} <label for="{{ field.id_for_label }}" class="form-check-label">{{ field.label }}</label></div>
  {% else %}
    <label for="{{ field.id_for_label }}" class="form-label fw-medium">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for err in field.errors %}<div class="text-danger small mt-1">{{ err }}</div>{% endfor %}
</div>
